<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music player</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="/images/musical-note.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidDcJHrrHSgvFpsYxqb6g97uaQTd2kE31rPUeDZTeDsjVq==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="container">
       <i class="fa-solid fa-volume" id="volume-icon"></i>

        <div class="album-img">
            <img src="./images/Boombox-amico.png" class="image">
        </div>
        <span class="album-name"></span>
        <span class="author-name"></span>

        <form>
            <label id="current-time"></label>
            <input type="range" id="progress-bar">
        </form>



    <div class="player-controls">
        <i class="fa-solid fa-backward" id="backward-btn"></i>
        <button id="run-music-button">
        </button>
       <i class="fa-solid fa-forward" id="forward-btn"></i>
    </div>
    </div>



    <script src="script.js"></script>
</body>
</html>
